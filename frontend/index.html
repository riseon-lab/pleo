<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0e13">
  <title>Character Studio</title>
  <link rel="preload" href="assets/fonts/ObelMono-VF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body>
  <!-- Boot / auth gate -->
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="brand-mark">Character Studio</div>
      <h1 class="boot-title">Your next<br>creation starts here.</h1>
      <div id="boot-body"><div class="spinner-wrap"><div class="spinner"></div><span class="muted">Starting…</span></div></div>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app" hidden>
    <nav id="sidebar" class="sidebar">
      <div class="side-brand">
        <span class="brand-mark small">Character Studio</span>
        <button id="collapse-btn" class="icon-btn side-collapse" aria-label="Toggle navigation" aria-controls="side-nav" aria-expanded="false">Menu</button>
      </div>
      <div class="side-nav" id="side-nav"></div>
      <div class="side-foot" id="side-foot"></div>
    </nav>
    <main id="view" class="view"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
