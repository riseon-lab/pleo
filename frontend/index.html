<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Creative workspace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/journey.css">
</head>
<body>
  <main id="welcome"></main>
  <!-- Boot / auth gate -->
  <div id="boot" class="boot" style="display:none">
    <div class="boot-card">
      <div class="brand-mark">Workspace</div>
      <div id="boot-body"><div class="spinner-wrap"><div class="spinner"></div><span class="muted">Starting…</span></div></div>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app" hidden>
    <nav id="sidebar" class="sidebar">
      <div class="side-brand">
        <span class="brand-mark small">Workspace</span>
        <button id="collapse-btn" class="icon-btn side-collapse" aria-label="Collapse sidebar">⟨</button>
      </div>
      <div class="side-nav" id="side-nav"></div>
      <div class="side-foot" id="side-foot"></div>
    </nav>
    <main id="view" class="view"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
